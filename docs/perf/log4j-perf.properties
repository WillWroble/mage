# Perf/gate runs: whole log to one non-rolling file, nothing on the console (surefire buffers test stdout).
# Use with -Dlog4j.configuration=file:<abs path to this file> -Dperf.log=<abs path to log file>
log4j.rootLogger=info, perf
log4j.logger.com.j256.ormlite=warn

log4j.appender.perf=org.apache.log4j.FileAppender
log4j.appender.perf.File=${perf.log}
log4j.appender.perf.append=false
log4j.appender.perf.layout=org.apache.log4j.PatternLayout
log4j.appender.perf.layout.ConversionPattern=%-5p %d{yyyy-MM-dd HH:mm:ss,SSS} %-90m =>[%t] %C{1}.%M %n
